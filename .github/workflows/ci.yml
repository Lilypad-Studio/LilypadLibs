name: CI

# On pull requests, and called by the release workflow on every push to main, before it publishes
# (see docs/releasing.md)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Also checks the package: publint, attw (the types of every entry) and the unused dependencies
      - run: npm run build
      # The build writes the `exports` and the `bin` of package.json from the entries of tsdown
      - name: Check that package.json matches the entries
        run: git diff --exit-code -- package.json
      - run: npm run knip
      - name: Audit the dependencies
        if: matrix.node == 24
        run: npm audit --audit-level=high
      - name: Pack the package
        if: matrix.node == 24
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == 24
        with:
          name: package
          path: lilypad-studio-libs-*.tgz
          retention-days: 7

  # The packed package, installed as an application installs it, on the lowest Node.js version of
  # `engines` (require() of ES modules starts with 22.12)
  smoke-test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          # The automatic npm cache runs npm in the repository, whose devEngines require the
          # Node.js version of the tools: the package is installed outside of it, without a cache
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/app
      - name: Install the package in an empty project
        working-directory: ${{ runner.temp }}/app
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund ./lilypad-studio-libs-*.tgz postgres@3.4.7
          cp "$GITHUB_WORKSPACE/scripts/smoke-test.mjs" .
      - name: Load every entry and run the command
        working-directory: ${{ runner.temp }}/app
        run: node smoke-test.mjs

  integration:
    # The runners have Docker: testcontainers starts PostgreSQL. Every Node.js version on the
    # default image, and the oldest and newest supported PostgreSQL versions on Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        pg: ['postgres:16-alpine']
        include:
          - node: 24
            pg: 'postgres:13-alpine'
          - node: 24
            pg: 'postgres:18-alpine'
    env:
      LILYPAD_TEST_PG_IMAGE: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration
