version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the minor and patch updates of the tools
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # @types/node follows the lowest Node.js version of `engines` (22.12): a newer one would let the
    # code use Node.js APIs that this version lacks
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
